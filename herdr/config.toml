onboarding = false
[keys]
# Press the Herdr prefix (Ctrl-b by default), then an arrow key to focus
# the adjacent pane.
focus_pane_left = "prefix+left"
focus_pane_right = "prefix+right"
focus_pane_up = "prefix+up"
focus_pane_down = "prefix+down"

# Jump back to the last pane actually visited (tmux's prefix+l), moved off l so
# it does not shadow the vim-style hjkl keys. last_pane is most-recently-used and
# global, unlike previous_workspace, which just steps up the spaces list.
last_pane = "prefix+alt+l"

# Free prefix+shift+g (Herdr's built-in new_worktree) for the folder picker below.
# Worktree creation lives on prefix+alt+g via `sdf worktree create`, which also
# copies .gitignored files, so the builtin was redundant.
new_worktree = ""

# Let the close helper pop wet worktrees before closing their workspace.
close_workspace = ""

[[keys.command]]
key = "prefix+shift+d"
type = "popup"
description = "Close the workspace, first popping wet worktrees with a root .wet.yaml."
command = "$HOME/dotfiles/herdr/scripts/herdr-close-workspace.sh"
width = "70%"
height = "40%"

# Create a worktree with `sdf worktree create`, then open it in Herdr.
[[keys.command]]
key = "prefix+alt+g"
type = "popup"
description = "Create an sdf worktree, then open it in Herdr."
command = "$HOME/dotfiles/herdr/scripts/sdf-worktree-open.sh create"
width = "70%"
height = "40%"

# Mount an existing branch with `sdf worktree mount`, then open it in Herdr.
[[keys.command]]
key = "prefix+alt+m"
type = "popup"
description = "Mount an existing sdf worktree branch, then open it in Herdr."
command = "$HOME/dotfiles/herdr/scripts/sdf-worktree-open.sh mount"
width = "80%"
height = "70%"

# prefix+g (goto) for folders: fuzzy-pick anything under ~/github and focus its
# space, opening one if it is not already up.
[[keys.command]]
key = "prefix+shift+g"
type = "popup"
description = "Pick a folder under ~/github and focus or open its space."
command = "$HOME/dotfiles/herdr/scripts/herdr-goto-folder.sh"
width = "70%"
height = "60%"

# Pick a repo anywhere under ~/github, sorted by the last commit authored by you,
# and open it as a new focused Herdr workspace.
[[keys.command]]
key = "prefix+alt+r"
type = "popup"
description = "Pick a recently contributed repo under ~/github and open a new workspace."
command = "$HOME/dotfiles/herdr/scripts/herdr-recent-repos.sh"
width = "85%"
height = "80%"

# Reorder the focused space. Herdr has no built-in move action, so these shell
# out to the socket API (workspace.move).
[[keys.command]]
key = "prefix+alt+k"
type = "shell"
description = "Move the focused space up in the sidebar."
command = "$HOME/dotfiles/herdr/scripts/herdr-move-workspace.py up"

[[keys.command]]
key = "prefix+alt+j"
type = "shell"
description = "Move the focused space down in the sidebar."
command = "$HOME/dotfiles/herdr/scripts/herdr-move-workspace.py down"

# Same actions as direct chords, so a space can be dragged several slots without
# re-entering prefix mode each time. Herdr has no way to scope a custom command
# to sidebar focus, so these are global.
[[keys.command]]
key = "ctrl+alt+k"
type = "shell"
description = "Move the focused space up in the sidebar."
command = "$HOME/dotfiles/herdr/scripts/herdr-move-workspace.py up"

[[keys.command]]
key = "ctrl+alt+j"
type = "shell"
description = "Move the focused space down in the sidebar."
command = "$HOME/dotfiles/herdr/scripts/herdr-move-workspace.py down"

# Scan open spaces and keep linked worktrees nested directly underneath their
# main checkout. If the main checkout is not open, open it first. Then sort
# repos, and the worktrees inside each, by their last commit.
[[keys.command]]
key = "prefix+alt+shift+r"
type = "shell"
description = "Reparent worktree spaces under their main checkout, then sort by last commit."
command = "$HOME/dotfiles/herdr/scripts/herdr-reparent-worktrees.py && $HOME/dotfiles/herdr/scripts/herdr-sort-workspaces.py"

# Pop the current worktree with `sdf worktree pop`, then close its workspace.
[[keys.command]]
key = "prefix+alt+shift+g"
type = "popup"
description = "Pop the current sdf worktree, then close its workspace."
command = "$HOME/dotfiles/herdr/scripts/sdf-worktree-pop.sh"
width = "70%"
height = "40%"

# Jump back to the space visited before this one (most-recently-used, tmux's
# prefix+l for spaces). Herdr's previous_workspace only steps up the sidebar list,
# so the MRU pair is tracked by the local lastspace plugin (herdr/plugins/last-space).
[[keys.command]]
key = "prefix+shift+l"
type = "plugin_action"
description = "Jump back to the previously focused space."
command = "jorgen.lastspace.jump"

# Toggle the reviewr code-review sidebar (persiyanov/herdr-reviewr).
[[keys.command]]
key = "cmd+r"
type = "plugin_action"
description = "Toggle the reviewr code-review sidebar."
command = "persiyanov.reviewr.toggle"

# Show clickable proof artifact cards for the focused pane/repo.
[[keys.command]]
key = "prefix+alt+p"
type = "plugin_action"
description = "Show clickable proof artifact cards."
command = "jorgen.proofcontext.cards"

# Open the active pane's directory in VS Code.
[[keys.command]]
key = "prefix+alt+c"
type = "shell"
description = "Open the active pane's directory in VS Code."
command = "code \"${HERDR_ACTIVE_PANE_CWD:-$PWD}\""

# prefix+u (up): prompt for a slug, create a `wet` worktree for it, open it as a
# child space of the current repo, and lay the whole solution out in three panes
# — the agent on the left, the slot setup/start + IEx in the top right,
# `just mobile run` under it.
[[keys.command]]
key = "prefix+u"
type = "popup"
description = "Create a wet worktree and open it with agent, stack, IEx and the app."
command = "$HOME/dotfiles/herdr/scripts/wet-worktree-space.sh"
width = "70%"
height = "40%"
[[keys.command]]
key = "prefix+shift+["
type = "popup"
description = "Pick a recent command and copy it with its output."
command = "$HOME/dotfiles/herdr/scripts/herdr-yank-command.sh"
width = "85%"
height = "80%"

# Scratch command popup: type any command, exit / ctrl+d closes it.
# Opens in the active pane's cwd, without touching the tab layout.
[[keys.command]]
key = "prefix+alt+comma"
type = "popup"
description = "Open a scratch shell popup in the active pane's directory."
command = "$SHELL -l"
width = "80%"
height = "60%"

# Rename the focused tab, tmux-style (prefix+,). Popup so the prompt is interactive.
[[keys.command]]
key = "prefix+comma"
type = "popup"
description = "Rename the focused tab."
command = "$HOME/dotfiles/herdr/scripts/herdr-rename-tab.sh"
width = "60%"
height = "20%"

# Jump to the first space in the sidebar list.
[[keys.command]]
key = "prefix+h"
type = "shell"
description = "Jump to the first space in the sidebar."
command = "$HOME/dotfiles/herdr/scripts/herdr-focus-first-workspace.sh"

# prefix+' scans the focused pane's recent output for copyable tokens (URLs,
# branches, paths, SHAs, ...) and copies the pick to the clipboard.
[[keys.command]]
key = "prefix+'"
type = "popup"
description = "Pick a copyable token from the focused pane's recent output."
command = "$HOME/dotfiles/scripts/herdr-pick"
width = "70%"
height = "60%"

# prefix+shift+o opens things mentioned in the current window/tab: URLs,
# localhost ports, filesystem paths, Android emulators, and iOS Simulators.
# Mentions from the last 100 lines appear first; it also reads project config
# (.env.worktree/.wet-worktrees.json) so Phoenix, Storybook, Tidewave, and
# Android emulator targets stay easy to reach.
[[keys.command]]
key = "prefix+shift+o"
type = "popup"
description = "Pick something mentioned in the current window/tab and open it."
command = "$HOME/dotfiles/herdr/scripts/herdr-open-mentioned.py"
width = "85%"
height = "70%"

[[keys.command]]
key = "cmd+shift+o"
type = "popup"
description = "Pick something mentioned in the current window/tab and open it."
command = "$HOME/dotfiles/herdr/scripts/herdr-open-mentioned.py"
width = "85%"
height = "70%"

# prefix+; goes where the focused pane says to go: it scans that pane's recent
# output for space and pane ids that still exist, and focuses the newest one.
# Two or more distinct destinations open a picker instead of guessing.
[[keys.command]]
key = "prefix+;"
type = "popup"
description = "Go to the space or pane the focused pane mentions."
command = "$HOME/dotfiles/herdr/scripts/herdr-goto-mentioned.py"
width = "80%"
height = "50%"

# prefix+shift+i: type a space id (w93) or part of a label and go there.
# The tree picker (prefix+shift+g is folders, Herdr's own is a tree) is for
# browsing; this is for when I already know the id.
[[keys.command]]
key = "prefix+shift+i"
type = "popup"
description = "Type a space id or label and focus that space."
command = "$HOME/dotfiles/herdr/scripts/herdr-goto-space.sh"
width = "70%"
height = "60%"

[theme]
name = "catppuccin"
auto_switch = false

# Show the pane-context metadata token in the agents sidebar row. The plugin
# writes this as `$summary`; without this row override Herdr's default agents
# list shows workspace/tab/agent info but not the current-work summary.
[ui.sidebar.agents.rows_by_agent]
claude = [["state_icon", "workspace", "tab"], ["$summary"], ["$proof"], ["agent"]]
codex = [["state_icon", "workspace", "tab"], ["$summary"], ["$proof"], ["agent"]]
pi = [["state_icon", "workspace", "tab"], ["$summary"], ["$proof"], ["agent"]]

# Pane graphics overlays, used by the pane-context plugin to draw the current
# work summary in the pane's top-right corner (herdr/plugins/pane_context).
[experimental]
kitty_graphics = true

# >>> ragnarok herdr keys: managed by `just herdr init`, do not edit inside >>>
# Herdr keybindings for this repo, merged into ~/.config/herdr/config.toml by
# `just herdr init` between its managed markers. Everything outside those
# markers is left alone: your prefix, your own bindings, your theme. A binding
# that already holds this key is taken over, and `just herdr init` in the repo
# that used to hold it takes it back.
#
# $HOME is expanded by Herdr when it runs the command, and `just herdr init`
# links this path at the repo's scripts/, so the binding does not depend on
# which worktree you are standing in and picks up edits with no re-init.

# prefix+alt+shift+n (new): prompt for a branch, create the sibling folder
# <repo>-<branch>, mount a worktree in it with `sdf worktree create
# --destination`, and open it as a child space split in two: the agent on the
# left, `just setup init && just run` on the right. Set HERDR_AGENT to use something
# other than claude.
[[keys.command]]
key = "prefix+alt+shift+n"
type = "popup"
description = "Ragnarok: new worktree space with the agent and just setup init && just run."
command = "$HOME/.config/herdr/scripts/ragnarok/worktree-new.sh"
width = "70%"
height = "40%"

[[keys.command]]
key = "prefix+alt+shift+d"
type = "popup"
description = "Ragnarok: return to main and tear down this worktree in the background (branch kept)."
command = "$HOME/.config/herdr/scripts/ragnarok/worktree-teardown.sh"
width = "70%"
height = "50%"
# <<< ragnarok herdr keys <<<
