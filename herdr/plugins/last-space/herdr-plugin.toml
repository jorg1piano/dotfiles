id = "jorgen.lastspace"
name = "lastspace"
version = "0.1.0"
# workspace.focused event hooks and plugin_action keybindings both exist in 0.8.0,
# which is what this was written against; nothing older has been checked.
min_herdr_version = "0.8.0"
description = "Jump back to the previously focused space, like tmux's last-window."
platforms = ["macos", "linux"]

# Herdr's built-in previous_workspace/next_workspace only step through the sidebar
# order, and last_pane is pane-scoped, so most-recently-used space tracking has to
# be maintained here: every focus change appends to a two-entry MRU file.
[[events]]
on = "workspace.focused"
command = ["sh", "-c", "exec \"$HERDR_PLUGIN_ROOT/record.sh\""]

[[actions]]
id = "jump"
title = "lastspace: jump to previous space"
contexts = ["global", "workspace", "tab", "pane"]
command = ["sh", "-c", "exec \"$HERDR_PLUGIN_ROOT/jump.sh\""]
